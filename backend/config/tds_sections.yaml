    name: "Dividend"
    payment_type: "dividend"
    deductee_types:
      - "Individual"
    rate:
      default: 10.0
    threshold: 5000
    time_of_deduction: "before_payment"
    payer: "domestic_company"
    notes: "POC value confirmed current — no Budget 2025 change found."

  # ----------------------------------------------------------
  # 194A / 393(1) — INTEREST OTHER THAN SECURITIES
  # UPDATED per Budget 2025 (effective 1 April 2025):
  # Threshold rationalized into three tiers. POC's flat Rs.40,000
  # is now OUTDATED.
  # ----------------------------------------------------------
  "194A":
    old_section: "194A"
    new_section: "393"
    new_subsection: "393(1)"
    category: "Category 5"
    name: "Interest (Other than Securities)"
    payment_type: "interest"
    deductee_types:
      - "Individual"
    rate:
      default: 10.0
    threshold:
      senior_citizen_bank: 100000    # Rs. 1,00,000 - senior citizens, banks
      bank_post_office: 50000         # Rs. 50,000 - banks/co-op/post office
      others: 10000                   # Rs. 10,000 - all other cases
    time_of_deduction: "credit_or_payment_whichever_earlier"
    payer: "non_individual_huf"
    notes: >
      UPDATED per Budget 2025 (effective 1 April 2025). POC used a
      flat Rs. 40,000 threshold - now outdated. Current law tiers
      the threshold: Rs. 1,00,000 (senior citizen, bank), Rs. 50,000
      (bank/co-op/post office), Rs. 10,000 (others).

