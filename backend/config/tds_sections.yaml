# ============================================================
# CROSS-SECTION RULES
# Source: POC tds_rules.py
# ============================================================

cross_section_rules:

  section_206AA:
    name: "PAN Not Furnished"
    rate: 20.0
    notes: "POC: no PAN -> flat 20% (validate_pan). Highest priority rule."

  section_206AB:
    name: "Non-Filer Higher Rate"
    rate: "max(2x_section_rate, 5_percent)"
    notes: >
      POC SECTION_206AB_MINIMUM_RATE = 5%. Applied as
      max(2x normal section rate, 5%) - validate_206ab.

  gst_exclusion:
    rule: "TDS base must exclude GST component (validate_gst)"
    gl_accounts_always_excluded:
      - "IGST OUTPUT - MH"
      - "CGST OUTPUT - MH"
      - "SGST OUTPUT - MH"
      - "IGST OUTPUT UNDER RCM - MH"
      - "CGST OUTPUT UNDER RCM - MH"
      - "SGST OUTPUT UNDER RCM - MH"
      - "IGST INPUT - MH"
      - "CGST INPUT - MH"
      - "SGST INPUT - MH"
      - "IGST UNDER RCM - MH"
      - "CGST UNDER RCM - MH"
      - "SGST UNDER RCM - MH"
      - "IGST INPUT IMPORT OF GOODS"

  form_15g_15h:
    rule: "If has_form_15g_15h is True, TDS must be 0 — nil TDS exemption"
    notes: "POC validate_form_15g_15h."

  form_197_lower_deduction:
    rule: "TDS must match certified lower-deduction rate exactly (+/- Rs.1 tolerance)"
    notes: "POC validate_lower_deduction_cert. Skips standard rate calc entirely."

  transporter_exemption_194C:
    rule: "194C + registered transporter + PAN available = fully exempt"
    notes: "POC is_transporter_exempt. Applies only within Section 194C."

  timing_rule:
    default: "credit_or_payment_whichever_earlier"
    at_payment_only:
      - "192A"
      - "392_2"
      - "194N"
      - "194LA"
    notes: >
      POC validate_timing checks missed TDS on advance payments and
      on year-end provision entries.

  excess_tds_check:
    rule: "TDS deducted cannot exceed invoice amount (validate_excess_tds)"

  residential_status_check:
    rule: >
      Non-resident vendor must use Section 195/196A-D. Resident vendor
      must NOT use non-resident sections. (POC validate_residential_status)


