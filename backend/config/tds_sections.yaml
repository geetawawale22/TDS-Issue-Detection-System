    payer: "non_individual_huf"
    notes: >
      UPDATED per Budget 2025 (effective 1 April 2025). POC used
      5% rate / Rs.15,000 threshold - both now outdated. Current
      law: 2% rate, Rs.20,000 threshold.

  # ----------------------------------------------------------
  # 194I / 393(1) — RENT
  # UPDATED per Budget 2025 (effective 1 April 2025):
  # Threshold changed from Rs.2,40,000/year (flat) to
  # Rs.50,000/month. Rate remains bifurcated: 10% land/building/
  # furniture, 2% plant & machinery. POC used flat 10% with no
  # P&M split and the old annual threshold - both now OUTDATED.
  # GL: RENTAL CHARGES - IT ASSETS -> APPLICABLE (per GL mapping)
  # ----------------------------------------------------------
  "194I":
    old_section: "194I"
    new_section: "393"
    new_subsection: "393(1)"
    category: "Category 2"
    name: "Rent"
    payment_type: "rent"
    deductee_types:
      - "Individual"
      - "HUF"
      - "Firm"
      - "Body Corporate"
    rate:
      land_building_furniture: 10.0
      plant_machinery_equipment: 2.0
    threshold: 50000                 # Rs. 50,000 PER MONTH (not annual)
    threshold_basis: "monthly"
    time_of_deduction: "credit_or_payment_whichever_earlier"
    payer: "non_individual_huf"
    gl_accounts:
      - "RENTAL CHARGES - IT ASSETS"
    gl_status: "APPLICABLE"
    notes: >
      UPDATED per Budget 2025 (effective 1 April 2025). Threshold
      changed from Rs.2,40,000/year flat to Rs.50,000/MONTH - TDS
      applies on the full month's amount once the monthly threshold
      is crossed, not just the excess. Rate bifurcation restored:
      10% land/building/furniture, 2% plant & machinery/equipment.
      RENTAL CHARGES - IT ASSETS (equipment) -> 2% rate applies.
      POC's flat 10% + annual Rs.2,40,000 threshold are both outdated.

