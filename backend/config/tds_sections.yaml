    payer: "specified"
    gl_status: "CONDITIONAL_50L"
    notes: >
      POC value confirmed current - no Budget 2025 change found.
      Rate split: Individual/HUF = 1%, Company/Firm/others = 2%.
      Transporter exemption: transporter + PAN available = exempt.

