sections:
  # ----------------------------------------------------------
  # 193 / 393(1) — INTEREST ON SECURITIES
  # POC value confirmed current — no Budget 2025 change.
  # ----------------------------------------------------------
  "193":
    old_section: "193"
    new_section: "393"
    new_subsection: "393(1)"
    category: "Category 5"
    name: "Interest on Securities"
    payment_type: "securities_interest"
    deductee_types:
      - "Individual"
    rate:
      default: 10.0
    threshold: 10000
    time_of_deduction: "credit_or_payment_whichever_earlier"
    payer: "any"
    notes: "POC value confirmed current — no Budget 2025 change found."

  # ----------------------------------------------------------
  # 194 / 393(1) — DIVIDEND
  # POC value confirmed current — no Budget 2025 change.
  # ----------------------------------------------------------
